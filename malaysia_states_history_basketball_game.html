        // --- 游戏全局状态 ---
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let correctAnswers = 0;
        let canShoot = false;
        let totalShots = 0;
        let successfulShots = 0;

        // --- Canvas 投篮物理系统变量 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 18, isDragging: false, isMoving: false, scored: false };
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        
        // 篮框物理对象位置 (动态适应分辨率)
        let hoop = { x: 0, y: 0, radius: 32, rimThickness: 6, backboardWidth: 12, backboardHeight: 120 };
        const gravity = 0.45;
        const friction = 0.985;
        const bounce = 0.72;

        // 调整 Canvas 尺寸
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            width = canvas.width = rect.width;
            height = canvas.height = rect.height;
            
            // 计算篮框位置 (靠右偏上)
            hoop.x = width * 0.75;
            hoop.y = height * 0.35;
            
            resetBallPosition();
        }

        // 将篮球复位至投篮点 (靠左下方)
        function resetBallPosition() {
            ball.x = width * 0.25;
            ball.y = height * 0.75;
            ball.vx = 0;
            ball.vy = 0;
            ball.isMoving = false;
            ball.isDragging = false;
            ball.scored = false;
        }

        // --- 渲染逻辑 ---
        function render() {
            ctx.clearRect(0, 0, width, height);

            // 1. 绘制背景木地板线与聚光灯效果
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);

            // 聚光灯
            const grad = ctx.createRadialGradient(width*0.5, height*0.3, 50, width*0.5, height*0.3, width*0.8);
            grad.addColorStop(0, 'rgba(59, 130, 246, 0.15)');
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 2. 绘制篮板与篮框 (后层)
            // 篮板柱
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(hoop.x + 35, height);
            ctx.lineTo(hoop.x + 35, hoop.y - 40);
            ctx.stroke();

            // 篮板
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 4;
            ctx.fillRect(hoop.x + 30, hoop.y - 70, hoop.backboardWidth, hoop.backboardHeight);
            ctx.strokeRect(hoop.x + 30, hoop.y - 70, hoop.backboardWidth, hoop.backboardHeight);
            // 篮板小框
            ctx.strokeStyle = '#ef4444';
            ctx.strokeRect(hoop.x + 30, hoop.y - 20, 8, 40);

            // 篮网 (后半部分)
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i = -hoop.radius + 5; i <= hoop.radius - 5; i += 10) {
                ctx.moveTo(hoop.x + i, hoop.y);
                ctx.lineTo(hoop.x + i * 0.5, hoop.y + 45);
            }
            ctx.stroke();

            // 篮框前沿圈 (Rim)
            ctx.strokeStyle = '#f97316'; // 橙色篮框
            ctx.lineWidth = hoop.rimThickness;
            ctx.beginPath();
            ctx.arc(hoop.x, hoop.y, hoop.radius, 0, Math.PI * 2);
            ctx.stroke();

            // 3. 拖拽瞄准虚线
            if (ball.isDragging && canShoot) {
                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y;
                
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                
                // 预估轨迹抛物线
                let simX = ball.x;
                let simY = ball.y;
                let simVx = dx * 0.15;
                let simVy = dy * 0.15;
                for(let t = 0; t < 25; t++) {
                    simX += simVx;
                    simY += simVy;
                    simVy += gravity;
                    ctx.lineTo(simX, simY);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // 拖拽力度圈
                ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, Math.min(Math.hypot(dx, dy), 120), 0, Math.PI * 2);
                ctx.stroke();
            }

            // 4. 绘制篮球
            ctx.save();
            ctx.translate(ball.x, ball.y);
            
            // 篮球阴影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, ball.radius + 15, ball.radius * 0.8, 6, 0, 0, Math.PI*2);
            ctx.fill();

            // 篮球本体
            const ballGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, ball.radius);
            ballGrad.addColorStop(0, '#fb923c');
            ballGrad.addColorStop(0.8, '#ea580c');
            ballGrad.addColorStop(1, '#9a3412');
            ctx.fillStyle = ballGrad;
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // 篮球黑色纹路
            ctx.strokeStyle = '#431407';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, -Math.PI*0.4, Math.PI*0.4);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-ball.radius, 0);
            ctx.lineTo(ball.radius, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -ball.radius);
            ctx.lineTo(0, ball.radius);
            ctx.stroke();

            ctx.restore();

            // 5. 篮网 (前半部分盖在球上，打造穿心效果)
            if (ball.scored) {
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let i = -hoop.radius + 5; i <= hoop.radius - 5; i += 8) {
                    ctx.moveTo(hoop.x + i, hoop.y);
                    ctx.lineTo(hoop.x + i * 0.3, hoop.y + 50);
                }
                ctx.stroke();
            }
        }

        // --- 物理运动与碰撞判定循环 ---
        function updatePhysics() {
            if (ball.isMoving) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += gravity;
                ball.vx *= friction;
                ball.vy *= friction;

                // 篮板碰撞 (后方竖直板)
                const bbX = hoop.x + 30;
                if (ball.x + ball.radius > bbX && ball.x - ball.radius < bbX + hoop.backboardWidth &&
                    ball.y > hoop.y - 70 && ball.y < hoop.y + 50) {
                    ball.vx = -ball.vx * bounce;
                    ball.x = bbX - ball.radius;
                }

                // 篮框前沿圈碰撞 (Rim Left & Right)
                const rimLeft = { x: hoop.x - hoop.radius, y: hoop.y };
                const rimRight = { x: hoop.x + hoop.radius, y: hoop.y };

                [rimLeft, rimRight].forEach(rim => {
                    const dist = Math.hypot(ball.x - rim.x, ball.y - rim.y);
                    if (dist < ball.radius + hoop.rimThickness / 2) {
                        // 简单弹性反弹
                        const angle = Math.atan2(ball.y - rim.y, ball.x - rim.x);
                        const speed = Math.hypot(ball.vx, ball.vy) * bounce;
                        ball.vx = Math.cos(angle) * speed;
                        ball.vy = Math.sin(angle) * speed;
                    }
                });

                // 进球判定: 球从上方穿过篮框平面
                if (!ball.scored && ball.vy > 0 && 
                    Math.abs(ball.x - hoop.x) < hoop.radius - 8 &&
                    Math.abs(ball.y - hoop.y) < 12) {
                    
                    ball.scored = true;
                    onScoreBasket();
                }

                // 触地或出界重置
                if (ball.y > height + 50 || ball.x > width + 50 || ball.x < -50) {
                    ball.isMoving = false;
                    if (!ball.scored) {
                        showFeedback("MISS!", "text-gray-400", "border-gray-500");
                    }
                    setTimeout(() => {
                        resetBallPosition();
                        disableShootingMode();
                        loadNextQuestion();
                    }, 1200);
                }
            }

            render();
            requestAnimationFrame(updatePhysics);
        }

        // --- 进球得分触发机制 ---
        function onScoreBasket() {
            successfulShots++;
            const points = 500 + streak * 50;
            score += points;
            document.getElementById('scoreText').innerText = score;

            // 触发全屏彩带特效
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.4 }
            });

            showFeedback(`SWISH! +${points}`, "text-amber-400", "border-amber-500");
        }

        // 显示浮动文字反馈
        function showFeedback(text, colorClass, borderClass) {
            const el = document.getElementById('shotFeedback');
            const txt = document.getElementById('feedbackText');
            txt.innerText = text;
            txt.className = `text-4xl md:text-5xl font-black drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] px-6 py-2 rounded-2xl border ${colorClass} ${borderClass} bg-slate-900/90`;
            
            el.style.opacity = '1';
            el.style.transform = 'translate(-50%, -80%) scale(1.1)';
            
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translate(-50%, -50%) scale(1.0)';
            }, 1000);
        }

        // --- 触摸与鼠标交互处理 ---
        function handleInputStart(clientX, clientY) {
            if (!canShoot || ball.isMoving) return;
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            // 点击篮球附近启动拖拽
            if (Math.hypot(x - ball.x, y - ball.y) < ball.radius * 2.5) {
                ball.isDragging = true;
                dragStart = { x: ball.x, y: ball.y };
                dragCurrent = { x, y };
            }
        }

        function handleInputMove(clientX, clientY) {
            if (!ball.isDragging) return;
            const rect = canvas.getBoundingClientRect();
            dragCurrent = {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleInputEnd() {
            if (!ball.isDragging) return;
            ball.isDragging = false;

            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            
            // 设定最小发射力度阈值
            if (Math.hypot(dx, dy) > 20) {
                totalShots++;
                ball.isMoving = true;
                ball.vx = dx * 0.15;
                ball.vy = dy * 0.15;
            }
        }

        // 事件监听绑定
        canvas.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => handleInputMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handleInputEnd);

        canvas.addEventListener('touchstart', e => {
            if (e.touches.length > 0) handleInputStart(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchmove', e => {
            if (e.touches.length > 0) handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchend', handleInputEnd);

            document.getElementById('progressText').innerText = `${currentIndex + 1} / ${questionBank.length}`;

            document.getElementById('questionText').innerText = `${q.id}. ${q.question}`;

            // 重置解释面板与按键状态
            document.getElementById('explanationBox').classList.add('hidden');
            
            // 渲染选项
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl text-sm font-medium transition-all flex items-center justify-between border glass-card hover:bg-slate-700/80 hover:border-slate-500 text-slate-200`;
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-xs font-bold text-slate-300">${String.fromCharCode(65 + idx)}</span>
                        <span>${opt}</span>
                    </div>
                    <i class="fa-regular fa-circle text-slate-500 status-icon"></i>
                `;
                btn.onclick = () => selectOption(idx);
                container.appendChild(btn);
            });
        }

        function selectOption(selectedIdx) {
            const q = questionBank[currentIndex];
            const options = document.querySelectorAll('#optionsContainer button');
            
            // 禁用所有按键
            options.forEach(btn => btn.disabled = true);

            const isCorrect = selectedIdx === q.answer;

            if (isCorrect) {
                correctAnswers++;
                streak++;
                if (streak > maxStreak) maxStreak = streak;
                score += 100 + streak * 20;

                options[selectedIdx].className = 'w-full text-left p-3.5 rounded-xl text-sm font-bold transition-all flex items-center justify-between border bg-emerald-950/80 border-emerald-500 text-emerald-200 shadow-lg';
                options[selectedIdx].querySelector('.status-icon').className = 'fa-solid fa-circle-check text-emerald-400';

                document.getElementById('explainTitle').innerText = "回答正确！解锁一次投篮机会！";
                document.getElementById('explainTitle').className = "font-bold text-sm text-emerald-400";
                document.getElementById('explainIcon').className = "fa-solid fa-circle-check text-emerald-400 mt-1";

                enableShootingMode();
            } else {
                streak = 0;
                options[selectedIdx].className = 'w-full text-left p-3.5 rounded-xl text-sm font-bold transition-all flex items-center justify-between border bg-rose-950/80 border-rose-500 text-rose-200';
                options[selectedIdx].querySelector('.status-icon').className = 'fa-solid fa-circle-xmark text-rose-400';

                // 高亮正确答案
                options[q.answer].className = 'w-full text-left p-3.5 rounded-xl text-sm font-bold transition-all flex items-center justify-between border bg-emerald-950/40 border-emerald-500/60 text-emerald-300';
                
                document.getElementById('explainTitle').innerText = "回答错误！遗憾错过投篮机会。";
                document.getElementById('explainTitle').className = "font-bold text-sm text-rose-400";
                document.getElementById('explainIcon').className = "fa-solid fa-circle-xmark text-rose-400 mt-1";
            }

            // 更新顶部得分
            document.getElementById('scoreText').innerText = score;
            document.getElementById('streakText').innerText = streak;
            document.getElementById('accuracyText').innerText = `${Math.round((correctAnswers / (currentIndex + 1)) * 100)}%`;

            // 展示知识解析
            document.getElementById('explainText').innerText = q.explain;
            document.getElementById('explanationBox').classList.remove('hidden');
        }

        // 启用投篮模式
        function enableShootingMode() {
            canShoot = true;
            const overlay = document.getElementById('shootOverlay');
            document.getElementById('overlayTitle').innerText = "准许投篮！";
            document.getElementById('overlayDesc').innerText = "按住右侧篮球拖拽后松开，把球投进篮框吧！";
            document.getElementById('shootHint').classList.remove('hidden');
            
            overlay.classList.remove('pointer-events-auto', 'bg-slate-950/60');
            overlay.classList.add('pointer-events-none', 'opacity-40');
        }

        // 禁用投篮模式
        function disableShootingMode() {
            canShoot = false;
            const overlay = document.getElementById('shootOverlay');
            document.getElementById('overlayTitle').innerText = "答题解锁投篮";
            document.getElementById('overlayDesc').innerText = "请先在答题板回答历史知识题！答对即可获得一次蓄力投篮机会。";
            document.getElementById('shootHint').classList.add('hidden');

            overlay.classList.add('pointer-events-auto', 'bg-slate-950/60');
            overlay.classList.remove('pointer-events-none', 'opacity-40');
        }

        // 加载下一题
        function loadNextQuestion() {
            currentIndex++;
            if (currentIndex < questionBank.length) {
                renderQuestion();
            } else {
                endGame();
            }
        }

        // 点击“准备投篮 / 下一题”按钮
        document.getElementById('nextBtn').onclick = () => {
            if (!canShoot) {
                // 如果没答对不能投篮，直接切下一题
                loadNextQuestion();
            } else {
                // 提醒玩家可以去右侧投篮，或者直接跳过投篮
                const confirmSkip = confirm("你当前拥有投篮机会！确定放弃投篮直接进入下一题吗？");
                if (confirmSkip) {
                    disableShootingMode();
                    loadNextQuestion();
                }
            }
        };

        // 结束游戏模态框
        function endGame() {
            const modal = document.getElementById('resultModal');
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalCorrect').innerText = `${correctAnswers} / ${questionBank.length}`;
            document.getElementById('finalMaxStreak').innerText = maxStreak;
            
            const basketAcc = totalShots > 0 ? Math.round((successfulShots / totalShots) * 100) : 0;
            document.getElementById('finalBasketAcc').innerText = `${basketAcc}%`;

            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 50);

            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.5 }
            });
        }

        // 重新开始游戏
        function restartGame() {
            currentIndex = 0;
            score = 0;
            streak = 0;
            maxStreak = 0;
            correctAnswers = 0;
            totalShots = 0;
            successfulShots = 0;
            
            document.getElementById('scoreText').innerText = '0';
            document.getElementById('streakText').innerText = '0';
            
            const modal = document.getElementById('resultModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);

            resetBallPosition();
            disableShootingMode();
            renderQuestion();
        }

        // 窗口初始化
        window.onload = () => {
            resizeCanvas();
            renderQuestion();
            requestAnimationFrame(updatePhysics);
        };

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
